<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QWERTZ Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QWERTZ Snake</h1>
            <div class="score-display">
                <span>Punkte: <span id="score">0</span></span>
            </div>
        </header>

        <div class="keyboard-section">
            <div class="direction-info">
                <div class="direction-item">
                    <span class="direction-arrow">↑</span>
                    <span class="direction-label">Oben</span>
                    <span class="direction-counter" id="counter-up">0/20</span>
                </div>
                <div class="direction-item">
                    <span class="direction-arrow">↓</span>
                    <span class="direction-label">Unten</span>
                    <span class="direction-counter" id="counter-down">0/20</span>
                </div>
                <div class="direction-item">
                    <span class="direction-arrow">←</span>
                    <span class="direction-label">Links</span>
                    <span class="direction-counter" id="counter-left">0/20</span>
                </div>
                <div class="direction-item">
                    <span class="direction-arrow">→</span>
                    <span class="direction-label">Rechts</span>
                    <span class="direction-counter" id="counter-right">0/20</span>
                </div>
            </div>
            <div class="virtual-keyboard" id="virtualKeyboard"></div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <div class="game-overlay" id="gameOverlay">
            <div class="overlay-content">
                <h2 id="overlayTitle">QWERTZ Snake</h2>
                <p id="overlayMessage">Drücke eine Taste zum Starten</p>
                <button id="restartButton" class="restart-button">Neues Spiel</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
